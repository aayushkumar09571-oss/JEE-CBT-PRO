name: Build JEE CBT PRO APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Sign release APK
        working-directory: android
        shell: bash
        run: |
          set -e
          keytool -genkeypair -v \
            -keystore jee-cbt-pro-release.jks \
            -alias jeecbtpro \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass changeit \
            -keypass changeit \
            -dname "CN=JEE CBT PRO, OU=App, O=JEE CBT PRO, L=India, ST=Rajasthan, C=IN"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" sign \
            --ks jee-cbt-pro-release.jks \
            --ks-pass pass:changeit \
            --key-pass pass:changeit \
            --out app/build/outputs/apk/release/jee-cbt-pro.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/jee-cbt-pro.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: JEE-CBT-PRO-installable-apk
          path: android/app/build/outputs/apk/release/jee-cbt-pro.apk
          if-no-files-found: error
